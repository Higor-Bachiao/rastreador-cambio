name: Atualizar cotações

on:
  schedule:
    - cron: "0 12 * * *" # 9h no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-cotacoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python -m unittest -v

      - name: Buscar cotações e regenerar gráfico
        run: python -m cambio

      - name: Commit do histórico
        run: |
          git config user.name "Higor Bachião"
          git config user.email "189991455+Higor-Bachiao@users.noreply.github.com"
          git add data README.md assets
          if git diff --staged --quiet; then
            echo "Nada mudou hoje."
            exit 0
          fi
          git commit -m "Cotações de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push
